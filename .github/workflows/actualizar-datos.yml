name: Actualizar eventos (scraping)

# Ejecuta el scraper de forma programada y, si hay cambios, actualiza events.json.
# Netlify (conectado a este repo) redespliega automaticamente al hacer push.

on:
  schedule:
    # Cada 8 horas (en UTC): 00:00, 08:00 y 16:00 UTC -> 3 veces al dia.
    # Ajusta la frecuencia aqui si lo necesitas.
    - cron: "0 */8 * * *"
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions de GitHub

permissions:
  contents: write       # necesario para hacer commit de events.json

concurrency:
  group: scraping
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python scraper.py --out events.json

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "deportv-bot"
          git config user.email "actions@users.noreply.github.com"
          if git status --porcelain events.json | grep -q .; then
            git add events.json
            git commit -m "chore: actualizar events.json ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
            echo "events.json actualizado y publicado."
          else
            echo "Sin cambios en events.json; no se hace commit."
          fi
